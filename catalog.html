<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='20' fill='%23f97316'/%3E%3Cpath d='M35 70L45 60M60 40L70 30M52 52C56 56 60 56 64 52C68 48 68 44 64 40L52 52Z' stroke='white' stroke-width='8' stroke-linecap='round' stroke-linejoin='round' fill='none'/%3E%3C/svg%3E">
<style>
html { background-color: #0f172a; overscroll-behavior-y: none; }
:root {
    --primary: #f97316;
    --primary-hover: #ea580c;
    --primary-light: #fff7ed;
    --text-dark: #0f172a;
    --text-gray: #64748b;
    --border: #e2e8f0;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
    font-family: system-ui, -apple-system, sans-serif;
    background: linear-gradient(135deg, #fff7ed 0%, #f8fafc 50%, #ffedd5 100%);
    background-size: 200% 200%;
    animation: gradientBG 15s ease infinite;
    color: #1e293b;
    line-height: 1.6;
    padding-bottom: 80px;
    overflow-x: hidden;
    overscroll-behavior-y: none;
}
@keyframes gradientBG { 0% { background-position: 0% 50%; } 50% { background-position: 100% 50%; } 100% { background-position: 0% 50%; } }
.container { max-width: 1200px; margin: 0 auto; padding: 0 20px; }

/* Шапка */
.header { background: #0f172a; color: #fff; padding: 12px 0; position: sticky; top: 0; z-index: 100; box-shadow: 0 4px 20px rgba(0,0,0,.15); border-bottom: 3px solid var(--primary); }
.header-content { display: flex; flex-direction: column; align-items: center; gap: 10px; }
.logo { display: flex; align-items: center; gap: 10px; font-size: 1.4rem; font-weight: 800; text-decoration: none; color: #fff; text-align: left; line-height: 1.1; }
.logo svg { width: 36px; height: 36px; flex-shrink: 0; transition: transform 0.3s ease; }
.logo:hover svg { transform: rotate(-15deg) scale(1.1); }
.logo-text { display: flex; flex-direction: column; }
.logo span { color: var(--primary); }

/* Меню навигации */
.nav-menu { display: flex; flex-wrap: wrap; justify-content: center; gap: 15px; margin-top: 10px; }
.nav-menu a { color: #cbd5e1; text-decoration: none; font-weight: 600; transition: color 0.3s; position: relative; font-size: 1rem; }
.nav-menu a::after { content: ''; position: absolute; bottom: -5px; left: 0; width: 0; height: 2px; background: var(--primary); transition: width 0.3s ease; }
.nav-menu a:hover::after, .nav-menu a.active::after { width: 100%; }
.nav-menu a:hover, .nav-menu a.active { color: var(--primary); }

/* Анимации */
@keyframes slideUpFade { from { opacity: 0; transform: translateY(30px); } to { opacity: 1; transform: translateY(0); } }
@keyframes popInBounce { 0% { opacity: 0; transform: scale(0.9) translateY(20px); } 60% { opacity: 1; transform: scale(1.02) translateY(-3px); } 100% { opacity: 1; transform: scale(1) translateY(0); } }
@keyframes pulseBtn { 0% { box-shadow: 0 0 0 0 rgba(249, 115, 22, 0.6); } 70% { box-shadow: 0 0 0 15px rgba(249, 115, 22, 0); } 100% { box-shadow: 0 0 0 0 rgba(249, 115, 22, 0); } }
.page { display: none; }
.page.active { display: block; animation: slideUpFade 0.5s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
.stagger-item { animation: popInBounce 0.6s cubic-bezier(0.34, 1.56, 0.64, 1) both; }

/* Управление */
.title { text-align: center; padding: 40px 0 20px; }
.title h1 { font-size: 2.2rem; color: var(--text-dark); font-weight: 800; }
.title p { color: var(--text-gray); margin-top: 10px; font-size: 1.1rem; }
.controls { background: #fff; padding: 15px; border-radius: 16px; box-shadow: 0 8px 25px rgba(0,0,0,.04); border: 1px solid var(--border); margin-bottom: 30px; display: flex; flex-direction: column; gap: 15px; }
.search-box { width: 100%; padding: 14px 20px; border: 2px solid var(--border); border-radius: 10px; font-size: 1rem; outline: none; transition: 0.3s; background: #f8fafc; }
.search-box:focus { border-color: var(--primary); background: #fff; box-shadow: 0 0 0 4px rgba(249,115,22,0.1); }

/* Сетки */
.grid { display: grid; grid-template-columns: repeat(2,1fr); gap: 20px; margin-bottom: 40px; }

/* Карточки */
.cat-card, .prod-card {
    background: #fff; border: 2px solid var(--border); border-radius: 16px;
    overflow: hidden; cursor: pointer; text-decoration: none; color: inherit;
    display: flex; flex-direction: column;
    transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    box-shadow: 0 4px 10px rgba(0,0,0,.02); position: relative;
}
.cat-card:hover, .prod-card:hover {
    transform: translateY(-8px) scale(1.02);
    box-shadow: 0 20px 40px rgba(249, 115, 22, 0.15);
    border-color: var(--primary); z-index: 2;
}

.cat-image-box { width: 100%; height: 140px; background: #fff; display: flex; align-items: center; justify-content: center; border-bottom: 1px solid var(--border); padding: 15px; }
.cat-image-box img { max-width: 100%; max-height: 100%; object-fit: contain; mix-blend-mode: multiply; transition: transform 0.3s ease; }
.cat-card:hover .cat-image-box img { transform: scale(1.1); }
.cat-image-box.no-photo { background: #f1f5f9; color: #94a3b8; font-weight: bold; font-size: 0.9rem; }

.cat-info { padding: 15px; text-align: center; display: flex; flex-direction: column; align-items: center; flex-grow: 1; }
.cat-title { font-size: 1.05rem; font-weight: 700; color: var(--text-dark); margin-bottom: 8px; }
.cat-count { font-size: .85rem; color: var(--text-gray); background: #f1f5f9; padding: 2px 10px; border-radius: 20px; margin-top: auto; transition: all 0.3s; }
.cat-card:hover .cat-count { background: var(--primary-light); color: var(--primary-hover); }

.prod-img-box { width: 100%; height: 140px; background: #fff; display: flex; align-items: center; justify-content: center; border-bottom: 1px solid var(--border); padding: 15px; }
.prod-img-box img { max-width: 100%; max-height: 100%; object-fit: contain; mix-blend-mode: multiply; transition: transform 0.3s ease; }
.prod-card:hover .prod-img-box img { transform: scale(1.1); }
.prod-img-box.no-photo { background: #f1f5f9; color: #94a3b8; font-weight: bold; font-size: 0.9rem; }
.prod-info { padding: 15px; text-align: center; display: flex; flex-direction: column; flex-grow: 1; }
.prod-title { font-size: 1rem; font-weight: 700; color: var(--text-dark); flex-grow: 1; }

.back-header { display: flex; align-items: center; gap: 15px; margin: 30px 0 20px; }
.back-btn { font-size: 1.1rem; color: var(--text-dark); text-decoration: none; font-weight: bold; padding: 10px 20px; background: #fff; border-radius: 10px; border: 2px solid var(--border); transition: all 0.3s; display: flex; align-items: center; gap: 8px; }
.back-btn:hover { color: var(--primary); border-color: var(--primary); transform: translateX(-5px); }
.back-header h2 { font-size: 1.6rem; color: var(--text-dark); }

.prod-detail { display: flex; flex-direction: column; gap: 30px; background: #fff; padding: 30px; border-radius: 20px; border: 2px solid var(--border); margin-top: 20px; position: relative; overflow: hidden; }
.prod-detail::before { content: ''; position: absolute; top: 0; left: 0; width: 100%; height: 6px; background: linear-gradient(90deg, var(--primary), #fbbf24); }
.detail-img-box { width: 100%; max-height: 350px; display: flex; justify-content: center; align-items: center; border: 1px solid var(--border); border-radius: 16px; padding: 20px; }
.detail-img-box img { max-width: 100%; max-height: 100%; object-fit: contain; mix-blend-mode: multiply; }
.detail-info h1 { font-size: 2rem; color: var(--text-dark); margin-bottom: 25px; }
.features-list { display: flex; flex-direction: column; gap: 15px; margin-bottom: 25px; }
.feature-item { display: flex; align-items: center; gap: 12px; font-size: 1.05rem; color: #475569; font-weight: 500; }
.feature-icon { width: 24px; height: 24px; color: #10b981; flex-shrink: 0; display: flex; align-items: center; justify-content: center; background: #ecfdf5; border-radius: 50%; }

/* ===== КНОПКА ВЫЗОВА ===== */
.call-btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    background: linear-gradient(135deg, #f97316, #ea580c);
    color: #fff;
    text-decoration: none;
    padding: 13px 26px;
    border-radius: 50px;
    font-weight: 700;
    font-size: 1rem;
    letter-spacing: 0.3px;
    border: none;
    cursor: pointer;
    position: relative;
    overflow: hidden;
    box-shadow: 0 4px 15px rgba(249,115,22,0.35);
    animation: callPulse 2.2s ease-in-out infinite;
    transition: transform 0.25s ease, box-shadow 0.25s ease;
}
.call-btn svg { width: 18px; height: 18px; flex-shrink: 0; }
.call-btn::before {
    content: '';
    position: absolute;
    top: 0; left: -120%;
    width: 100%; height: 100%;
    background: linear-gradient(90deg, transparent, rgba(255,255,255,0.45), transparent);
    transform: skewX(-20deg);
    animation: callShimmer 3s ease-in-out infinite;
}
.call-btn:hover {
    transform: translateY(-3px) scale(1.04);
    box-shadow: 0 10px 28px rgba(249,115,22,0.6);
    animation: none;
}
.call-btn:active { transform: translateY(-1px) scale(0.99); }

@keyframes callPulse {
    0%, 100% { box-shadow: 0 4px 15px rgba(249,115,22,0.35); }
    50%      { box-shadow: 0 4px 25px rgba(249,115,22,0.65); }
}
@keyframes callShimmer {
    0%   { left: -120%; }
    60%,100% { left: 120%; }
}

.footer { background: #0f172a; color: #94a3b8; text-align: center; padding: 30px 0; font-size: .9rem; margin-top: 50px; border-top: 3px solid var(--primary); }
.mobile-call { display: flex; position: fixed; bottom: 20px; left: 20px; right: 20px; background: linear-gradient(135deg, var(--primary), var(--primary-hover)); color: #fff; padding: 16px; border-radius: 50px; text-decoration: none; font-weight: 700; z-index: 100; justify-content: center; transition: 0.2s; gap: 10px; align-items: center; }
.mobile-call svg { width: 20px; height: 20px; }

@media(min-width:640px){
    .header-content { flex-direction: row; justify-content: space-between; }
    .nav-menu { gap: 25px; }
    .grid { grid-template-columns: repeat(3,1fr); }
    .mobile-call { display: none; }
    body { padding-bottom: 0; }
    .prod-detail { flex-direction: row; align-items: flex-start; }
    .detail-img-box { width: 50%; }
    .detail-info { flex: 1; }
}
@media(max-width: 639px) {
    .nav-menu { gap: 10px; }
    .nav-menu a { font-size: 0.9rem; }
}
@media(min-width:1024px){ .grid { grid-template-columns: repeat(4,1fr); } }
</style>

let currentCat = '';

function renderCats() {
  const search = document.getElementById('search-cat').value.toLowerCase();
  
  let items = Object.entries(DB).filter(([key, data]) => {
    return data.t.toLowerCase().includes(search);
  });

  items.sort((a, b) => a[1].t.localeCompare(b[1].t));

  let html = '';
  items.forEach(([key, c], index) => {
    let delay = (index % 15) * 0.05; 
    
    let coverImg = '';
    for (let item of c.items) {
      if (item.img) { coverImg = item.img; break; }
    }
    
    let imgHtml = coverImg 
      ? `<div class="cat-image-box"><img src="${coverImg}" onerror="this.style.display='none'; this.parentElement.innerHTML='<span style=\\'color:#94a3b8;font-weight:bold;font-size:1rem\\'>ФОТО</span>';"></div>`
      : `<div class="cat-image-box no-photo">ФОТО</div>`;

    html += `<a href="#${key}" class="cat-card stagger-item" style="animation-delay:${delay}s">
      ${imgHtml}
      <div class="cat-info">
        <div class="cat-title">${c.t}</div>
        <div class="cat-count">${c.items.length} шт.</div>
      </div>
    </a>`;
  });
  document.getElementById('cats-grid').innerHTML = html || '<p style="grid-column:1/-1;text-align:center;padding:20px">Ничего не найдено</p>';
}

function renderItems(catKey) {
  const search = document.getElementById('search-item').value.toLowerCase();
  const cat = DB[catKey];
  let items = cat.items.filter(item => item.t.toLowerCase().includes(search));

  items.sort((a, b) => a.t.localeCompare(b.t));

  let html = '';
  items.forEach((item, index) => {
    let delay = (index % 15) * 0.05;
    
    let imgHtml = item.img 
      ? `<div class="prod-img-box"><img src="${item.img}" onerror="this.style.display='none'; this.parentElement.innerHTML='<span style=\\'color:#94a3b8;font-weight:bold;font-size:0.9rem\\'>ФОТО</span>';"></div>`
      : `<div class="prod-img-box no-photo">ФОТО</div>`;
    
    html += `<a href="#prod-${item.id}" class="prod-card stagger-item" style="animation-delay:${delay}s">
      ${imgHtml}
      <div class="prod-info">
        <div class="prod-title">${item.t}</div>
      </div>
    </a>`;
  });
  document.getElementById('items-grid').innerHTML = html || '<p style="grid-column:1/-1;text-align:center;padding:20px">Ничего не найдено</p>';
}

function router() {
  const hash = window.location.hash.replace('#', '');
  document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));

  if (!hash) {
    document.getElementById('view-cats').classList.add('active');
    return;
  }

  if (hash.startsWith('prod-')) {
    const prodId = hash.replace('prod-', '');
    let item = null;
    for (let key in DB) {
      let found = DB[key].items.find(i => i.id === prodId);
      if (found) { item = found; currentCat = key; break; }
    }
    if (item) {
      document.getElementById('back-to-cat-btn').href = `#${currentCat}`;
      document.getElementById('p-title').innerText = item.t;
      
      if (item.img) {
        document.getElementById('p-img').innerHTML = `<img src="${item.img}" onerror="this.style.display='none'; this.parentElement.innerHTML='<span style=\\'color:#94a3b8;font-weight:bold;font-size:1.5rem\\'>ФОТО</span>'">`;
      } else {
        document.getElementById('p-img').innerHTML = '<span style="color:#94a3b8;font-weight:bold;font-size:1.5rem">ФОТО</span>';
      }
      document.getElementById('view-prod').classList.add('active');
    }
  } else if (DB[hash]) {
    currentCat = hash;
    document.getElementById('cat-title').innerText = DB[hash].t;
    document.getElementById('search-item').value = ''; 
    renderItems(hash);
    document.getElementById('view-cat').classList.add('active');
  }
}

renderCats();
window.addEventListener('hashchange', router);
window.addEventListener('load', () => { if (window.location.hash) router(); });
</script>
