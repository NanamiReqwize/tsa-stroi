<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Каталог инструмента</title>
<style>
:root {
    --primary: #f97316;
    --primary-hover: #ea580c;
    --primary-light: #fff7ed;
    --text-dark: #0f172a;
    --text-gray: #64748b;
    --border: #e2e8f0;
}

* { margin: 0; padding: 0; box-sizing: border-box; }

/* Анимированный фон */
body {
    font-family: system-ui, -apple-system, sans-serif;
    background: linear-gradient(135deg, #fff7ed 0%, #f8fafc 50%, #ffedd5 100%);
    background-size: 200% 200%;
    animation: gradientBG 15s ease infinite;
    color: #1e293b;
    line-height: 1.6;
    padding-bottom: 80px;
    overflow-x: hidden;
}
@keyframes gradientBG {
    0% { background-position: 0% 50%; }
    50% { background-position: 100% 50%; }
    100% { background-position: 0% 50%; }
}

.container { max-width: 1200px; margin: 0 auto; padding: 0 20px; }

/* Шапка */
.header {
    background: rgba(15, 23, 42, 0.95);
    backdrop-filter: blur(10px);
    color: #fff;
    padding: 16px 0;
    position: sticky;
    top: 0;
    z-index: 100;
    box-shadow: 0 4px 20px rgba(0,0,0,.15);
    border-bottom: 3px solid var(--primary);
}
.header-content { display: flex; flex-direction: column; align-items: center; gap: 10px; }
.logo { font-size: 1.5rem; font-weight: 800; text-decoration: none; color: #fff; }
.logo span { color: var(--primary); }
.nav-menu { display: flex; gap: 25px; margin-top: 10px; }
.nav-menu a { color: #cbd5e1; text-decoration: none; font-weight: 600; transition: color 0.3s; position: relative; }
.nav-menu a::after {
    content: ''; position: absolute; bottom: -5px; left: 0; width: 0; height: 2px;
    background: var(--primary); transition: width 0.3s ease;
}
.nav-menu a:hover::after, .nav-menu a.active::after { width: 100%; }
.nav-menu a:hover, .nav-menu a.active { color: var(--primary); }

/* ===== АНИМАЦИИ ===== */
@keyframes slideUpFade {
    from { opacity: 0; transform: translateY(30px); }
    to { opacity: 1; transform: translateY(0); }
}
@keyframes popInBounce {
    0% { opacity: 0; transform: scale(0.9) translateY(20px); }
    60% { opacity: 1; transform: scale(1.02) translateY(-3px); }
    100% { opacity: 1; transform: scale(1) translateY(0); }
}
@keyframes pulseBtn {
    0% { box-shadow: 0 0 0 0 rgba(249, 115, 22, 0.6); }
    70% { box-shadow: 0 0 0 15px rgba(249, 115, 22, 0); }
    100% { box-shadow: 0 0 0 0 rgba(249, 115, 22, 0); }
}

/* Скрываем все страницы по умолчанию */
.page { display: none; }
/* Показываем только активную */
.page.active { display: block; animation: slideUpFade 0.5s cubic-bezier(0.16, 1, 0.3, 1) forwards; }

.stagger-item { animation: popInBounce 0.6s cubic-bezier(0.34, 1.56, 0.64, 1) both; }

/* Сетки и Карточки */
.title { text-align: center; padding: 40px 0 20px; }
.title h1 { font-size: 2.2rem; color: var(--text-dark); font-weight: 800; text-shadow: 2px 2px 4px rgba(249,115,22,0.1); }
.title p { color: var(--text-gray); margin-top: 10px; font-size: 1.1rem; }

.controls {
    background: #fff; padding: 20px; border-radius: 16px;
    box-shadow: 0 8px 25px rgba(0,0,0,.04);
    border: 1px solid var(--border); margin-bottom: 30px;
    display: flex; flex-direction: column; gap: 15px;
    transition: all 0.3s;
}
.controls:focus-within { box-shadow: 0 10px 30px rgba(249,115,22,0.15); border-color: var(--primary); }
.search-box {
    width: 100%; padding: 14px 20px; border: 2px solid var(--border); border-radius: 10px;
    font-size: 1rem; outline: none; transition: 0.3s; background: #f8fafc;
}
.search-box:focus { border-color: var(--primary); background: #fff; box-shadow: 0 0 0 4px rgba(249,115,22,0.1); }
.filters { display: flex; gap: 10px; flex-wrap: wrap; }
.filters select {
    flex: 1; padding: 12px 15px; border: 2px solid var(--border); border-radius: 10px;
    font-size: .95rem; outline: none; background: #fff; cursor: pointer; transition: 0.3s;
}
.filters select:focus { border-color: var(--primary); }
.alphabet { display: flex; flex-wrap: wrap; gap: 5px; justify-content: center; margin-top: 5px; }
.alphabet button {
    background: #f1f5f9; border: 1px solid var(--border); padding: 6px 12px; border-radius: 6px;
    cursor: pointer; font-weight: 600; color: #475569; transition: all 0.2s;
}
.alphabet button:hover { background: #fed7aa; color: var(--primary-hover); border-color: var(--primary); }
.alphabet button.active {
    background: linear-gradient(135deg, var(--primary), var(--primary-hover));
    color: #fff; border-color: transparent; box-shadow: 0 4px 10px rgba(249,115,22,0.3);
}

.grid { display: grid; grid-template-columns: repeat(2,1fr); gap: 20px; margin-bottom: 40px; }

/* СТИЛЬНЫЕ КАРТОЧКИ С БЛИКОМ */
.cat-card, .prod-card {
    background: #fff;
    border: 2px solid var(--border);
    border-radius: 16px;
    padding: 20px 15px;
    text-align: center;
    cursor: pointer;
    text-decoration: none;
    color: inherit;
    display: flex;
    flex-direction: column;
    align-items: center;
    transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    box-shadow: 0 4px 10px rgba(0,0,0,.02);
    position: relative;
    overflow: hidden; 
    /* Гарантируем, что клики будут работать */
    pointer-events: auto; 
}

/* Эффект блика (Shine) - декоративный, клики пропускает */
.cat-card::before, .prod-card::before {
    content: '';
    position: absolute;
    top: 0; left: -100%;
    width: 50%; height: 100%;
    background: linear-gradient(to right, rgba(255,255,255,0) 0%, rgba(255,255,255,0.8) 50%, rgba(255,255,255,0) 100%);
    transform: skewX(-25deg);
    transition: left 0.6s ease;
    z-index: 3;
    pointer-events: none; /* ВАЖНО: чтобы блик не блокировал нажатие */
}

.cat-card:hover, .prod-card:hover {
    transform: translateY(-8px) scale(1.02);
    box-shadow: 0 20px 40px rgba(249, 115, 22, 0.15);
    border-color: var(--primary);
    background: linear-gradient(to bottom right, #ffffff, var(--primary-light));
    z-index: 2;
}
.cat-card:hover::before, .prod-card:hover::before { left: 150%; }
.cat-card:active, .prod-card:active { transform: translateY(-2px) scale(0.98); }

.cat-title { font-size: 1.1rem; font-weight: 700; color: var(--text-dark); z-index: 1; position: relative; transition: color 0.3s; }
.cat-card:hover .cat-title { color: var(--primary-hover); }
.cat-count { font-size: .85rem; color: var(--text-gray); margin-top: 8px; background: #f1f5f9; padding: 2px 10px; border-radius: 20px; z-index: 1; position: relative; transition: background 0.3s; }
.cat-card:hover .cat-count { background: #ffedd5; color: var(--primary-hover); }

.prod-img { width: 100%; height: 140px; object-fit: contain; margin-bottom: 15px; mix-blend-mode: multiply; transition: transform 0.4s ease; z-index: 1; position: relative; }
.prod-card:hover .prod-img { transform: scale(1.1) translateY(-5px); }
.no-photo { background: #f1f5f9; display: flex; align-items: center; justify-content: center; color: #94a3b8; font-weight: bold; border-radius: 10px; font-size: .9rem; width: 100%; height: 140px; margin-bottom: 15px; }
.prod-title { font-size: 1rem; font-weight: 700; color: var(--text-dark); margin-bottom: 10px; flex-grow: 1; z-index: 1; position: relative; }
.prod-price { font-size: 1.2rem; font-weight: 800; color: var(--primary); margin-top: auto; background: #fff7ed; padding: 5px 10px; border-radius: 8px; z-index: 1; position: relative; transition: all 0.3s; }
.prod-card:hover .prod-price { background: var(--primary); color: #fff; box-shadow: 0 4px 10px rgba(249,115,22,0.3); }

/* Кнопка назад */
.back-header { display: flex; align-items: center; gap: 15px; margin: 30px 0 20px; }
.back-btn { font-size: 1.1rem; color: var(--text-dark); text-decoration: none; font-weight: bold; padding: 10px 20px; background: #fff; border-radius: 10px; border: 2px solid var(--border); transition: all 0.3s; display: flex; align-items: center; gap: 8px; }
.back-btn:hover { color: var(--primary); border-color: var(--primary); transform: translateX(-5px); box-shadow: 0 4px 10px rgba(249,115,22,0.15); }
.back-btn:active { transform: scale(0.95); }
.back-header h2 { font-size: 1.6rem; color: var(--text-dark); }

/* ДЕТАЛЬНАЯ СТРАНИЦА ТОВАРА */
.prod-detail { display: flex; flex-direction: column; gap: 30px; background: #fff; padding: 30px; border-radius: 20px; box-shadow: 0 10px 30px rgba(0,0,0,.05); border: 2px solid var(--border); position: relative; overflow: hidden; margin-top: 20px; }
.prod-detail::before { content: ''; position: absolute; top: 0; left: 0; width: 100%; height: 6px; background: linear-gradient(90deg, var(--primary), #fbbf24); }
.detail-img-box { width: 100%; max-height: 350px; display: flex; justify-content: center; align-items: center; border: 1px solid var(--border); border-radius: 16px; padding: 20px; transition: transform 0.4s ease; background: #fff; }
.detail-img-box:hover { transform: scale(1.02); }
.detail-img-box img { max-width: 100%; max-height: 100%; object-fit: contain; mix-blend-mode: multiply; animation: popInBounce 0.6s ease; }
.detail-info h1 { font-size: 2rem; color: var(--text-dark); margin-bottom: 15px; }
.detail-price { font-size: 3rem; font-weight: 800; color: var(--primary); margin-bottom: 25px; animation: slideUpFade 0.6s ease; text-shadow: 1px 1px 2px rgba(249,115,22,0.1); }

/* СПИСОК С ХАРАКТЕРИСТИКАМИ */
.features-list { display: flex; flex-direction: column; gap: 15px; margin-bottom: 35px; }
.feature-item { display: flex; align-items: center; gap: 12px; font-size: 1.05rem; color: #475569; font-weight: 500; }
.feature-icon { width: 24px; height: 24px; color: #10b981; flex-shrink: 0; display: flex; align-items: center; justify-content: center; background: #ecfdf5; border-radius: 50%; }

/* КНОПКА ПОЗВОНИТЬ */
.call-btn { display: flex; align-items: center; justify-content: center; gap: 12px; background: linear-gradient(135deg, var(--primary), var(--primary-hover)); color: #fff; text-decoration: none; padding: 18px; border-radius: 12px; font-weight: 700; font-size: 1.2rem; transition: all 0.3s; animation: pulseBtn 2s infinite; border: none; cursor: pointer; width: 100%; }
.call-btn svg { width: 24px; height: 24px; transition: transform 0.3s ease; }
.call-btn:hover { transform: translateY(-3px); box-shadow: 0 10px 20px rgba(249,115,22,0.4); animation: none; }
.call-btn:hover svg { transform: rotate(15deg) scale(1.1); }
.call-btn:active { transform: scale(0.95); }

/* Футер */
.footer { background: #0f172a; color: #94a3b8; text-align: center; padding: 30px 0; font-size: .9rem; margin-top: 50px; border-top: 3px solid var(--primary); }
.mobile-call { display: flex; position: fixed; bottom: 20px; left: 20px; right: 20px; background: linear-gradient(135deg, var(--primary), var(--primary-hover)); color: #fff; padding: 16px; border-radius: 50px; text-decoration: none; font-weight: 700; z-index: 100; justify-content: center; transition: 0.2s; animation: pulseBtn 2s infinite; gap: 10px; align-items: center; box-shadow: 0 4px 15px rgba(0,0,0,0.2); }
.mobile-call svg { width: 20px; height: 20px; }
.mobile-call:active { transform: scale(0.95); animation: none; }

@media(min-width:640px){
    .header-content { flex-direction: row; justify-content: space-between; }
    .grid { grid-template-columns: repeat(3,1fr); }
    .mobile-call { display: none; }
    body { padding-bottom: 0; }
    .prod-detail { flex-direction: row; align-items: flex-start; }
    .detail-img-box { width: 50%; }
    .detail-info { flex: 1; }
    .filters select { flex: none; width: 200px; }
}
@media(min-width:1024px){ .grid { grid-template-columns: repeat(4,1fr); } }
</style>

let currentCat = '';
let filterLetter = '';

function getMinPrice(cat) {
  let min = Infinity;
  cat.items.forEach(i => { let num = parseInt(i.p.replace(/\D/g,'')); if (num && num < min) min = num; });
  return min === Infinity ? 0 : min;
}

function renderAlphabet() {
  const letters = "АБВГДЕЖЗИЙКЛМНОПРСТУФХЦЧШЩЭЮЯ".split("");
  let html = `<button onclick="setLetter('')" class="${filterLetter===''?'active':''}">Все</button>`;
  letters.forEach(l => { html += `<button onclick="setLetter('${l}')" class="${filterLetter===l?'active':''}">${l}</button>`; });
  document.getElementById('alphabet-filters').innerHTML = html;
}

function setLetter(l) { filterLetter = l; renderAlphabet(); renderCats(); }

function renderCats() {
  const search = document.getElementById('search-cat').value.toLowerCase();
  const sort = document.getElementById('sort-cat').value;
  
  let items = Object.entries(DB).filter(([key, data]) => {
    const matchSearch = data.t.toLowerCase().includes(search);
    const matchLetter = filterLetter === '' || data.t.toUpperCase().startsWith(filterLetter);
    return matchSearch && matchLetter;
  });

  items.sort((a, b) => {
    if (sort === 'alpha-asc') return a[1].t.localeCompare(b[1].t);
    if (sort === 'alpha-desc') return b[1].t.localeCompare(a[1].t);
    if (sort === 'price-asc') return getMinPrice(a[1]) - getMinPrice(b[1]);
    if (sort === 'price-desc') return getMinPrice(b[1]) - getMinPrice(a[1]);
  });

  let html = '';
  items.forEach(([key, c], index) => {
    let delay = (index % 15) * 0.05; 
    // Используем надежную ссылку href, браузер сам поменяет hash
    html += `<a href="#${key}" class="cat-card stagger-item" style="animation-delay:${delay}s">
      <div class="cat-title">${c.t}</div>
      <div class="cat-count">${c.items.length} шт.</div>
    </a>`;
  });
  document.getElementById('cats-grid').innerHTML = html || '<p style="grid-column:1/-1;text-align:center;padding:20px">Ничего не найдено</p>';
}

function renderItems(catKey) {
  const search = document.getElementById('search-item').value.toLowerCase();
  const sort = document.getElementById('sort-item').value;
  const cat = DB[catKey];
  let items = cat.items.filter(item => item.t.toLowerCase().includes(search));

  items.sort((a, b) => {
    let pA = parseInt(a.p.replace(/\D/g,'')) || 0;
    let pB = parseInt(b.p.replace(/\D/g,'')) || 0;
    if (sort === 'alpha-asc') return a.t.localeCompare(b.t);
    if (sort === 'alpha-desc') return b.t.localeCompare(a.t);
    if (sort === 'price-asc') return pA - pB;
    if (sort === 'price-desc') return pB - pA;
  });

  let html = '';
  items.forEach((item, index) => {
    let delay = (index % 15) * 0.05;
    let imgHtml = item.img ? `<img src="${item.img}" class="prod-img" onerror="this.style.display='none'; this.nextElementSibling.style.display='flex';">` : `<div class="prod-img no-photo" style="display:flex">ФОТО</div>`;
    let fallback = `<div class="prod-img no-photo" style="display:none">ФОТО</div>`;
    
    html += `<a href="#prod-${item.id}" class="prod-card stagger-item" style="animation-delay:${delay}s">
      ${item.img ? imgHtml + fallback : fallback}
      <div class="prod-title">${item.t}</div>
      <div class="prod-price">${item.p} / сутки</div>
    </a>`;
  });
  document.getElementById('items-grid').innerHTML = html || '<p style="grid-column:1/-1;text-align:center;padding:20px">Ничего не найдено</p>';
}

// ===== РОУТЕР (ГЛАВНАЯ ЛОГИКА ПЕРЕКЛЮЧЕНИЯ СТРАНИЦ) =====
function router() {
  const hash = window.location.hash.replace('#', '');
  
  // 1. Скрываем абсолютно все страницы
  document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));

  // 2. Если хэша нет - показываем категории
  if (!hash) {
    document.getElementById('view-cats').classList.add('active');
    return;
  }

  // 3. Если открывается товар (начинается на prod-)
  if (hash.startsWith('prod-')) {
    const prodId = hash.replace('prod-', '');
    let item = null;
    
    // Ищем этот товар во всей базе
    for (let key in DB) {
      let found = DB[key].items.find(i => i.id === prodId);
      if (found) { 
        item = found; 
        currentCat = key; 
        break; 
      }
    }
    
    if (item) {
      // Настраиваем кнопку "Назад в категорию"
      document.getElementById('back-to-cat-btn').href = `#${currentCat}`;
      
      // Заполняем данные
      document.getElementById('p-title').innerText = item.t;
      document.getElementById('p-price').innerText = item.p + ' / сутки';
      
      if (item.img) {
        document.getElementById('p-img').innerHTML = `<img src="${item.img}" onerror="this.style.display='none'; this.parentElement.innerHTML='<span style=\\'color:#94a3b8;font-weight:bold;font-size:1.5rem\\'>ФОТО</span>'">`;
      } else {
        document.getElementById('p-img').innerHTML = '<span style="color:#94a3b8;font-weight:bold;font-size:1.5rem">ФОТО</span>';
      }
      
      // Показываем страницу товара
      document.getElementById('view-prod').classList.add('active');
    }
  } 
  // 4. Если открывается категория
  else if (DB[hash]) {
    currentCat = hash;
    document.getElementById('cat-title').innerText = DB[hash].t;
    document.getElementById('search-item').value = ''; 
    renderItems(hash);
    
    // Показываем страницу категории
    document.getElementById('view-cat').classList.add('active');
  }
}

// Инициализация при загрузке
renderAlphabet();
renderCats();

// Слушаем изменения ссылки (нажатия на карточки)
window.addEventListener('hashchange', router);

// Если пользователь обновил страницу с уже открытой категорией/товаром
window.addEventListener('load', () => {
  if (window.location.hash) {
    router();
  }
});
</script>
